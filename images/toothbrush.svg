<svg xmlns="http://www.w3.org/2000/svg" width="480" height="200" viewBox="0 0 480 200">
  <defs>
    <linearGradient id="handle" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#5aa9ff"/>
      <stop offset="1" stop-color="#1f6fe0"/>
    </linearGradient>
    <linearGradient id="bristle" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#cfe8ff"/>
    </linearGradient>
  </defs>
  <!-- handle -->
  <path d="M40 128 Q 40 112 58 112 L 300 118 Q 320 119 336 112 L 420 104 Q 440 103 440 118 Q 440 132 420 132 L 336 130 Q 320 129 300 134 L 58 144 Q 40 144 40 128 Z" fill="url(#handle)" stroke="#16519f" stroke-width="2"/>
  <!-- grip -->
  <ellipse cx="120" cy="128" rx="40" ry="8" fill="#ffffff" opacity="0.35"/>
  <!-- head base -->
  <rect x="330" y="96" width="100" height="16" rx="8" fill="url(#handle)" stroke="#16519f" stroke-width="2"/>
  <!-- bristles -->
  <g fill="url(#bristle)" stroke="#8dbbe8" stroke-width="1">
    <rect x="336" y="56" width="10" height="42" rx="3"/>
    <rect x="350" y="52" width="10" height="46" rx="3"/>
    <rect x="364" y="50" width="10" height="48" rx="3"/>
    <rect x="378" y="50" width="10" height="48" rx="3"/>
    <rect x="392" y="52" width="10" height="46" rx="3"/>
    <rect x="406" y="56" width="10" height="42" rx="3"/>
    <rect x="420" y="60" width="8" height="38" rx="3"/>
  </g>
  <!-- toothpaste -->
  <path d="M338 54 Q 350 34 366 46 Q 380 30 396 44 Q 412 34 424 54 Q 410 48 396 52 Q 380 44 366 52 Q 350 46 338 54 Z" fill="#e8f6ff" stroke="#7fc4f0" stroke-width="1.5"/>
  <!-- sparkles -->
  <g fill="#7fc4f0">
    <path d="M300 60 l4 10 l10 4 l-10 4 l-4 10 l-4 -10 l-10 -4 l10 -4 z"/>
    <path d="M450 40 l3 7 l7 3 l-7 3 l-3 7 l-3 -7 l-7 -3 l7 -3 z"/>
  </g>
</svg>
